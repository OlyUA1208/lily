<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lily — адмінка</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<div class="demo-note" id="demoNote" hidden>Демо-режим: зміни зберігаються лише в цьому браузері. Пароль: demo12</div>

<section id="login" class="login" hidden>
  <form id="loginForm" class="login-box">
    <svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#9A5249" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M24 6C29 14 29 24 24 32C19 24 19 14 24 6Z"/><path d="M24 32C16 30 9 24 8 14C15 16 21 22 24 32Z"/><path d="M24 32C32 30 39 24 40 14C33 16 27 22 24 32Z"/><path d="M24 32V42"/></svg>
    <h1>Lily · адмінка</h1>
    <label class="field" style="width:100%">Пароль<input class="input" id="pw" type="password" autocomplete="current-password" required></label>
    <span class="err" id="loginErr" hidden></span>
    <button class="btn btn-lg btn-block" type="submit">Увійти</button>
    <a href="./" style="font-size:14px">← На сайт</a>
  </form>
</section>

<div id="app" hidden>
  <header class="a-head">
    <a href="./" class="logo" target="_blank" rel="noopener" title="Відкрити сайт">
      <svg width="32" height="32" viewBox="0 0 48 48" fill="none" stroke="#9A5249" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M24 6C29 14 29 24 24 32C19 24 19 14 24 6Z"/><path d="M24 32C16 30 9 24 8 14C15 16 21 22 24 32Z"/><path d="M24 32C32 30 39 24 40 14C33 16 27 22 24 32Z"/><path d="M24 32V42"/></svg>
      <span class="logo-word" style="font-size:28px">Lily</span>
    </a>
    <nav class="a-tabs" role="tablist" aria-label="Розділи адмінки">
      <button type="button" role="tab" data-tab="products" aria-selected="true">Товари</button>
      <button type="button" role="tab" data-tab="orders">Замовлення <span class="count" id="newOrders" hidden></span></button>
      <button type="button" role="tab" data-tab="reports">Звіти</button>
      <button type="button" role="tab" data-tab="categories">Категорії</button>
      <button type="button" role="tab" data-tab="settings">Налаштування</button>
    </nav>
    <button type="button" class="btn btn-soft" id="logout">Вийти</button>
  </header>
  <main class="a-main" id="panel"></main>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer editor" id="editor" aria-label="Редагування товару" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="edTitle">Новий товар</h2>
    <button type="button" class="icon-btn" data-close-editor aria-label="Закрити">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#33241F" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <form class="drawer-body" id="edForm" novalidate></form>
  <div class="drawer-foot" style="flex-direction:row">
    <button type="button" class="btn btn-soft" data-close-editor style="flex:1">Скасувати</button>
    <button type="submit" form="edForm" class="btn" id="edSave" style="flex:2">Зберегти товар</button>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
